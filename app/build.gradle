plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tunnel'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tunnel"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.0"
    }

    buildTypes {
        release {
            // Signed with the debug key so `assembleRelease` gives an installable APK straight away.
            // Shrinking stays off: the SSH library (JSch) uses reflection and was not verified under R8.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    // SSH client (used only by the SSH protocol). Drop-in alternative: 'com.jcraft:jsch:0.1.55'
    implementation 'com.github.mwiede:jsch:0.2.20'
}
